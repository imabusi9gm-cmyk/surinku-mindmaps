# レミさん 自己理解マインドマップ

## 1. 理想の将来像
- フリーランスで手取り21万円以上、稼げるなら青天井に稼ぎたい
- ライフステージの変化（結婚・出産・体調等）に合わせて柔軟に働く時間を調整したい
- 時間・場所に縛られない働き方

## 2. 現在地・課題
- 在宅ワーク分野の知識がまだ乏しい → 基礎から積み上げる必要
- 不安が大きく、自信をつけたい
- 一人で目標を継続するのが苦手（仲間・つながりがないと続かない）

## 3. 価値観
- 感謝・思いやり・礼儀
- 保育士の仕事を通じて意識するようになった
- 困った時に助けてもらった経験 → 周りの人を大切にしたい

## 4. 保育士時代のやりがい
### 保護者からの感謝
- 感謝の言葉・手紙をもらえた瞬間が嬉しい
### 子どもの成長
- 信頼関係があるからこそ見られる表情を実感できた
### 同僚との絆
- 大変な時期を一緒に乗り越えた同僚と今も交流が続く
### 制作・企画（謝恩会など）
- リサーチして複数の情報を組み合わせてオリジナルを作る
- Pinterestなどで海外事例まで調べる、没頭して時間を忘れる
- ゼロから生み出すより「素材を集めて掛け合わせる」タイプ
- インスタ運用のリサーチ業務と親和性が高い（本人も気づいて驚いていた）

## 5. 得意なこと・強み
- リサーチ＆編集力（複数の情報から組み合わせてオリジナリティを出す）
- 段取り力・先回り力（早め早めに動き周りをフォロー）
- 俯瞰力（仕事や人間関係を一歩引いて客観視）
- 察知力（相手の機嫌や場の空気を敏感に読む）
- 傾聴力（あまり話さない人の意見を引き出すのが好き）
- 切り替えの速さ（オンオフが明確、仕事を引きずらない）
- 調整力（対立する意見も整理して一致点を伝えられる）

## 6. 苦手・ストレス要因
- 意見が強すぎる相手との妥協点探し
- 威圧的な言い方をされるとその場で言葉が出てこない（後で整理して伝えるタイプ）
- コントロールできない要因（他人の休み等）で計画が乱れること
- 一人での目標継続（仲間がいないと甘えが出る自覚あり）

## 7. 幼少期・性格の背景
- 元々のんびり屋・恥ずかしがりや・人見知り（家では活発、外では静か）
- 兄の影響で活発な遊びと女の子らしい遊びの両方を経験
- 習い事（ピアノ・書道・水泳）は母や兄がきっかけで始めた受け身のものだったが、振り返ると保育士の仕事すべてに活きていた
- 高校の部活での人間関係のもめごとをきっかけに人の顔色をうかがう習慣がついた
- 「一人だと続かない、一緒にやる人がいると頑張れる」継続スタイルは昔から一貫

## 8. すりんくでの示唆・次のアクション（1回目セッション時点）
- つながり・コミュニティ参加が継続のカギ（講義・作業会・オフ会に積極参加を推奨済み）
- インスタ運用との相性が良い可能性大（リサーチ×組み合わせ作業が得意かつ好き）

## 9. 【2回目】他己分析で見えてきたこと
- 友人・夫・仕事仲間にヒアリングを実施
- 共通して挙がった評価：物事を俯瞰して見る／自分の意見・考えを持っている／心が強い／落ち着いて見える／未来を見据えた行動ができる
- 友人からの評価：聞き上手・話し上手、面倒見がいい、礼儀正しい
- 仕事仲間からの評価：より具体的で客観的、仕事面での強みが多く挙がった
- 新たな気づき：自分では「頭の中が忙しく落ち着いていない」と感じているが、周囲からは「落ち着いている」と見られていた

## 10. 【2回目】コミュニケーションの成長エピソード
- 社会人になりたての頃は、悩みや不安を周囲（特に仕事相手）にため込んでしまい苦しんでいた
- 転職を重ねる中で「言った方が楽になる」と学習し、少しずつ気持ちを伝えられるように変化
- 同僚から「もっと適当でいい」とアドバイスを受け、伝え方・力の抜き方を学んだ
- うまくいっている人のやり方を参考にしつつ、自分なりの表現方法にアレンジして取り入れるスタイル
- 「全部言う」のではなく「言う相手・伝える割合」を選んで人間関係のバランスを取っている

## 11. 【2回目】成功体験：保育園のお化け屋敷企画
- 「モンスターズインク」×和風の世界観を掛け合わせたオリジナル企画を考案
- 子どもたちと映画鑑賞から一緒にスタートし、意見を取り入れながら作り上げるプロセスを重視
- 前日3時間という短い準備時間の中で、誰にどの作業を任せるかを瞬時に判断し周囲を巻き込んで采配
- 苦手な制作（絵など）は同僚の得意分野を見極めて依頼し、チームとして高いクオリティを実現
- 結果：子どもたちに「楽しかった、もう一回やりたい」と言われ、保護者からも高評価
- 本人の気づき：時間をかけたことは言わなくても伝わる／周囲を采配する「司令塔」的なポジションが好き

## 12. 【2回目】新たに見えた強み・特性
- 段取り力：仕事を通じて逆算スケジューリングが得意になり、プライベートでも年間/月間/週間で予定を立てる習慣に
- 責任ある立場を早期（3年目）に任された経験から、意識的にリーダー/ディレクター的役割を身につけた
- 「司令塔」ポジション（周囲に指示を出し、全体を管理する役割）にやりがいを感じるタイプ
- フットワークの軽さ：信頼する人からの勧めは素直に試してみる姿勢
- 没頭力：一度スイッチが入ると集中して黙々と取り組める（ドラマ、読書などでも顕著）

## 13. 【2回目】今後の方向性：インスタグラム発信に集中
- 興味のあった3コース（オンライン秘書・インスタ発信・デザイン）の中から、インスタグラム発信に一点集中する方針に決定
- 理由：時間の余裕がある今のうちに土台を作ることで将来的な仕事の幅が大きく広がる／複数コンテンツを並行すると投稿ペースが落ち伸びが遅くなるため
- ジャンル選定の視点を学習
  - 生活動線上に組み込めるか（頻繁な外出が必要なジャンルは本人の性質上ハードルが高いと自己分析）
  - 本当に好きかどうか
  - 自分にしか出せない差別化ポイント（保育士としての経験など）
- 保育士経験を活かした教材・ネタ提供的な発信に関心

## 14. 【2回目】1年後の目標
- 保育士時代の手取り以上の収入を目指す
- 引っ越し（1年半後予定）までの期間を活用して在宅ワークの基盤を作る
- 現在夫の扶養に入っているため、収益が一定を超えたタイミングで扶養から外れる想定
- 将来的には妊娠・ライフステージの変化も見据えつつ、保育士パート＋在宅ワークの両立も視野に

## 15. 【2回目】アクションアイテム（次回Zoomまで）
- [ ] Discordの「コンテンツリンク」からインスタコンテンツを申請し、真由子にメンションする
- [ ] インスタの基礎編・初期設定編の動画を視聴する
- [ ] 発信者目線でインスタアカウントをリサーチし、コンセプト・ジャンルのアイデアを出す
- [ ] 初期設定が終わったら真由子に連絡してミーティングを行う
