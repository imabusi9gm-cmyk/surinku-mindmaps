# ひろよさん 自己理解マインドマップ

## 1. セッション概要
- 自己理解は「何のコンテンツを選ぶか」を主に決めていく位置づけ。初回は1〜2回のセッションを予定
- コンテンツ決定後も、迷ったタイミングでいつでもZoomして相談できる
- 初回は地震の影響を確認しつつ実施（自宅の被害は少なく、買い物等は可能な状況）

## 2. 自己理解ワークとの向き合い方
- 価値観ワークで「充実度％」などの項目を記入。お金・マインドの項目は自信が持てず書きにくかった
- ワークを通じて「自分のマイナス面を見ないようにしていた」ことに気づいた
- お金の面、夫との関係など、これまで意識的に「考えないようにしていた／避けていた」ことを自覚

## 3. 現状（自己評価）
- 収入面はほぼゼロに等しい状態
- 家族（特に夫）に経済的に頼りきりで、それを負担に感じている
- 現状の満足度は低く、マイナス面が強いと自己評価

## 4. 理想の暮らし・働き方
- 家族に迷惑をかけず、子どもたちにかかる食費などを自分の収入で賄えるようになりたい
- 自分の収入で家族みんなでご飯や旅行に行きたい（沖縄・海外旅行が目標）
- 今のパートを続けながら在宅ワークも行う形、将来的には在宅ワークのみで月50万円以上稼げるようになりたい
- 「運用代行を任せてもらえる自分」になることが理想像の一つ

## 5. 理想に対して足りないもの
- どんな在宅ワークがあるのか、どうやってその仕事につながるのかという知識・情報がまだ不足している
- 「1時間1,000円」のような単発の仕事しか経験がなく、何を学べば収入につながるのかが分かっていない

## 6. 性格：前に出ることへの苦手意識
- 人前に出る・注目を浴びる場面で強い緊張を感じる。昔からの傾向で、保育園の頃から発表会などが苦手だった記憶がある
- 小学校高学年時、学級委員の候補に名前が挙がり、クラスメイトに囲まれる形になって泣き出してしまった経験が今も強く記憶に残っている
- 「みんなのために何かをする」こと自体は好きだが、前に出て発表する・まとめ役になることに強い抵抗がある
- 裏方・サポート的な立場であれば問題なくこなせるタイプ

## 7. インスタスクール（グラムハック）での経験
- 自分のアカウントで発信するタイプのスクールではなく、「運用代行」など裏方の仕事につなげる位置づけで受講
- 発信者になることは元々想定しておらず、裏方の仕事を目指して入学した経緯
- 他の受講生の発信を見て、「顔出しせず自分を出さない形」であれば自分で発信することにも少し興味が湧いた（ただし何を発信するかは未定）
- 総合すると、現時点では裏方の仕事の方が自分に合っていると感じている

## 8. 性格：没頭しやすさと現実逃避の自覚
- 一度やると決めたこと（スマホのコレクション系アプリなど実利のないもの）には熱中してしまう傾向がある
- 本来向き合うべきこと（お金の不安、友人への連絡など）を後回しにして、目の前の別のことに逃げてしまう自覚がある
- 例：地震後、県外の友人グループから安否確認が来たが、返信できずに1ヶ月近く経ってしまった経験

## 9. 価値観・働く上で大事にしたいこと
- 一緒に仕事をする相手のことを考えて働きたい（現在のパート先の高齢の利用者の声に耳を傾けることを大切にしている）
- 一方で「流されやすく、自分の軸が弱い」という自己分析。単価が低い仕事でも断れず引き受けてしまう傾向がある
- 今後は「流されない自分」に変えていきたいという意思がある
- 人生で大事にしたいこと：争いのない、笑顔のある暮らし。家族を大切にすること

## 10. 価値観ワークで繰り返し出てきたキーワード
- 「学び」「挑戦」「自分を大切に」というキーワードが複数回登場
- コーチからのアドバイス：繰り返し出てくる言葉は本人が無意識に大事にしている価値観のサイン

## 11. 言語化力を高めるための提案（コーチより）
- 自分の性格や気持ちを言語化するのが難しいという課題に対し、ジャーナリング（頭に浮かぶことをそのまま書き出す）や、自分の声を録音して聞き返す方法（コーチ自身のVoicy配信の例）を提案
- 継続的なアウトプットの練習が、今後の仕事や人間関係での意思表示にも役立つという位置づけ

## 12. 1回目の宿題・次回までのステップ
- 自己理解ワークは現在28ページ程度まで完了。残りのページ（得意なこと・成功体験など）を次回セッションまでに全て埋める
- 次回セッションでは「得意なこと」「過去の成功体験」を深掘りし、学ぶコンテンツを具体的に決定する予定
- ワークが完了したら本人からメンションして連絡し、次回セッションを設定する

## 13. 【2回目】他者から見た自分・行動パターン
- 周囲から「謝りすぎる」とよく指摘される
- 相談せずに一人で考え抜いて決断するタイプ。「そんな行動力あったんだ」と周囲を驚かせることが多い（例：別居も1ヶ月ほど一人で考え抜いた末に周囲へ伝え、驚かれた）
- 一方で「一緒にいると安心する」「素のままでいられる」と言われることも多い

## 14. 【2回目】成功体験①：ケーキ屋への転職
- 高校卒業後に就いた職人系の仕事が、本来やりたかったパン・ケーキ作りとは違う分野で、ずっと違和感を持っていた
- 転職活動中にケーキ屋を見つけてすぐ面接・即採用。専門学校に通った経験はなく独学だったが、教わったコツをすぐに習得しスムーズに仕事として身についた

## 15. 【2回目】強み：素直に人の意見を聞ける
- 教えてもらうことが好きで、指摘されても反発心を持たず素直に実践できる性格
- コーチのフィードバック：自己流に走らずまず言われた通りに実践できることは、学習効率を大きく左右する重要な強み

## 16. 【2回目】成功体験②：小学校の応援団への立候補
- 人前に出るのは苦手だったが、「誰もやりたがらないなら」と運動会の応援団に自ら立候補
- 一人で目立つのではなく「みんなで頑張る」形だったからこそ挑戦できたと分析
- 毎日の練習も含め楽しい思い出として強く記憶に残っており、「殻を破った」経験として自覚

## 17. 【2回目】性格：感受性の豊かさ（涙もろさ）
- 人が頑張っている姿やドラマなどに感情移入してすぐ涙が出る。中学生の頃（ウォーターボーイズ等の作品）から自覚し始めた
- 悲しい涙より「感動」「嬉しい」の涙が多いタイプ。他者の頑張りを見ることが自分の頑張る活力になっている

## 18. 【2回目】コンテンツ検討の広がり
- インスタ（動画編集などの裏方業務）に関心。オンライン秘書は「スケジュール管理中心」という思い込みがあったが、実際はクライアントの困りごと全般を代行する仕事と知り興味を持つ
- LINE構築は未経験でイメージが湧きにくい。デザインもやってみたいが、まずは収入化を優先したいという優先順位

## 19. 【2回目】現状・使える時間
- 現職（ポスティング系代理店）は地震の影響で担当エリアの訪問が難しくなり、出勤日数・収入が一時的に減少中。退職・転籍の意思はなく、今の職場を継続したい意向
- 現在、丸1日在宅の日が週3〜4日ある状態。子どもの夏休み終了後はさらに使える時間が増える見込み
- 実家暮らしで生活費の負担は少ないが、食費や家賃の一部を自分の収入で負担できる自立を目指したい

## 20. 【2回目】グラムハックでの学びの振り返り
- フィード投稿デザイン制作は「楽しかった」：写真選定、色の指定（3色ルールなど）、添削フィードバックのプロセスを楽しめた
- リール動画編集：素材を組み合わせる編集作業自体は好きだが、自宅の撮影スペース確保が難しく、撮影工程が負担だった

## 21. 【2回目】収入目標
- 半年後：月10万円、1年後：月30〜50万円を目指したい
- 「稼げるだけ稼ぎたい」という意欲があり、しっかり取り組みたいという本気度を確認

## 22. 【2回目】紹介案件：動画編集・パートナー契約
- スリンクの知人企業からの動画編集／台本作成の業務委託案件を紹介される（ライトプラン月8本で4万円、月16本で8万円、時給換算1,800〜2,500円相当）
- 1ヶ月の無償研修期間を経て採用されれば、継続的な在宅収入につながる仕組み
- グラムハックで制作した動画2本を提出物として活用できる見込みで、後日LINEで送付予定

## 23. 【2回目】コンテンツ選定の絞り込み：インスタ vs デザイン
- インスタ：運用代行を目指すには本来自分のアカウント運用経験が前提だが、紹介案件はアカウント不要から始められる特例あり
- デザイン：現在アクティブに活動している受講生が2名（年齢の近い新米ママ）おり、学びやすい環境。業務はスライド制作が中心
- 学習期間に明確な基準はなく、トレース・提出・フィードバック反映の量など本人の取り組み次第で早まる
- その場では決定せず、一旦持ち帰って検討することに（LINE構築・オンライン秘書も引き続き選択肢として残る）
