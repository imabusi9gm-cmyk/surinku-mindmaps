# さきさん 自己理解マインドマップ

## 1. コース概要
- 特別コースのため、自己理解はInstagram運用に特化した内容で進める
- ワークは26ページまで進行済み、映像コンテンツも視聴済み

## 2. 現状・理想の働き方
### 現職
- 保育士（固定収入・安定）
- 月1回程度、講師業・セラピスト業も実施
### 理想の暮らし
- 子どもが帰宅する15時までに仕事を終える
- 朝型で、朝に集中して働きたい
- 権利収入を一つ確立したい
- 講師業・セラピスト業の割合を増やしたい

## 3. モチベーションの背景
- 現在は「踏み出した段階」で、継続・結果はこれから、と自己評価（本人評価はまだゼロレベル）
- 過去にスポーツクラブでイベント企画・体操教室の立ち上げ等を主導し、結果を出してきた経験あり
- 今は子育て優先で「力を発揮できていない」もどかしさ・悔しさが強いモチベーションになっている
- 時間的・金銭的な制約がやりたいことを最大限できない要因だと自覚している

## 4. 収入目標
- 保育士の給与（約15万円）＋副収入15万円＝合計約30万円が当面の第一目標
- 副収入の内訳：doTERRA（MLM）で約10万円、インスタ運用代行等SNS関連で約5万円
- 半年後にはさらに倍増を目指す意向
- doTERRAのシルバーランク（手取り15〜20万）を今年中に達成目標
- シルバー達成の目安は新規メンバー20〜30人程度（購入単価により変動）
- これまでのdoTERRA集客はインスタ経由ゼロ、既存の知人・ご縁のみで拡大してきた

## 5. doTERRAとの出会い・原体験
- コロナ禍で子どもの薬が手に入りにくい不安から検索し、doTERRAに出会う
- 最初は使わず放置していたが、マンションの隣人がたまたまdoTERRAユーザーで、講座をきっかけに再開
- 使ってみて実感・変化があり、「口コミだけじゃない」と発信への意欲につながった
- 同じくベビーヨガのインストラクター仲間が、ストーリーで毎日コツコツ発信していた姿にも影響を受けた

## 6. Instagram戦略の方向性
### フェーズの整理（コーチからの示唆）
- リール・フィード投稿＝認知獲得、ストーリー＝教育・販売、と役割分担するのが基本
- doTERRAはアフィリエイトと異なり1万人フォロワー不要。ターゲットに刺されば3,000人でも購入につながる
- まずの目標はフォロワー2,000〜3,000人
### 伸び方の特性
- インスタの成長はS字カーブ（序盤は緩やかで、どこかで急伸する）
- 序盤の継続が最重要というのを自身も実感（想定より現実的なペースであることに気づいた回でもあった）
### doTERRAを前面に出しすぎない設計
- 最初からdoTERRA紹介をメインにするとdoTERRAユーザーしか集まらない（実際に過去そうなった経験あり）
- まずはターゲット層（ママさん）が自然に見るジャンル（レシピ・暮らし・子どもとの遊び・工作など）で認知を広げるのが先決
- doTERRAはストーリーでさりげなく登場させる形でOK
### 顔・姿出しの重要性
- 手元だけの投稿では「この人から買いたい」につながらない
- 顔出し必須ではないが、後ろ姿など自分が映ることは必須（「誰から買うか」が重視される時代のため）
### その他の方針
- 投稿ネタ出しや台本作成にAIを使うのは問題ない。ただし本人が苦労せず継続できるジャンル選びが前提
- 自分のアカウント育成期間中は、運用代行案件は自分のペースに合うものだけを受ける形が望ましい

## 7. 今後のスケジュール感
- 7月：コンセプト再設計、準備期間
- 8月〜：本格的なInstagram運用開始
- 9〜12月：集中して成長を狙う時期（本人も意識している）
- 来年4月：環境変化に備えて余裕を持てる状態を目指す

## 8. アクションアイテム（次回Zoom/音声セッションまで）
- [ ] さき：スリンクのInstagramコンテンツ（1章・2章）を申請し、内容を確認する
- [ ] さき：自分が継続できそうなInstagram投稿ジャンルをいくつかピックアップし、LINEで送る
- [ ] さき：doTERRAをよく売っているInstagramアカウントを数件調べ、URLをLINEで送る
- [ ] さき：参考になる競合・ベンチマークアカウントがあれば合わせてLINEで送る
- [ ] コーチ：さきから送られた内容を確認後、次回Zoomまたは音声セッションを設定する
