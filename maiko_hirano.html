# まいこさん 自己理解マインドマップ

## 1. セッション概要
- 自己理解は「何のコンテンツを選ぶか」を一緒に決めていくことが目的。初回は1〜2回のセッションを予定
- コンテンツ決定後も、迷ったタイミングでいつでもZoomして伴走してもらえる
- 初回の今回は、性格や価値観など「その人自身」を知ることに重点を置いて実施

## 2. 自己理解ワークとの向き合い方
- 「自分のことになると言語化が難しい」という感覚がある
- 理想のページはざっくりとは書けても、細かく（暮らし別など）落とし込むのが難しかった
- 価値観ワークは完了。書きながら「同じワードが繰り返し出てくる」ことに自分で気づいた

## 3. 理想の暮らし・働き方
- キーワードは「柔軟な働き方」：子どもの小学校入学に伴う学級閉鎖など急な予定変更に対応できる働き方を望む
- 今の仕事（アパレル）自体は辞めたくない気持ちもある
- 理想に近づくために必要なのは「自分ができること・スキルの選択肢を増やすこと」という自己認識
- 今すぐ転換するというより、いざという時に柔軟に働き方をシフトできるよう備えておきたいという考え方

## 4. 価値観・強み：人に寄り添う力
- 価値観ワークで繰り返し出てきたキーワード：「人のため」「お店のため」「メンバーのため」「子どものため」
- アパレル業界歴約10年、うち5〜6年は店長を経験。業績が落ちた店舗の立て直しを何度も任され、評価されてきた
- スタッフ一人ひとりと向き合い、深く関わることを「辛い」と感じたことがない。相手が「なぜそう考えるのか」を掘り下げるのが好き（恋愛心理学の本を読むなど自主的に学ぶことも）
- 異動後も元スタッフと食事に行くなど関係が継続。「まいこさんのおかげで頑張れた」と直接感謝された経験も複数
- プライベートの相談に乗ったスタッフ2人が結婚し、お礼を伝えに来てくれたエピソードも
- 本人はこれらを「無意識にできること」と捉えており、当初は自分の強みとして自覚していなかった

## 5. コーチからのフィードバック：ポータブルスキル
- 「人に寄り添い、チーム全体を良い方向に導く力」は業種を問わず活きるポータブルスキルであるという指摘
- アパレル・店長という枠に限定されず、他業種・在宅ワークでも転用可能な才能として自覚しておくとよい、というアドバイス

## 6. モチベーション・得意なスタイル
- 「みんなで同じ方向を向いて目標を達成する」ことが好き（例：全国売上1位を目指すチーム目標）
- 一人で0から1を生み出すことより、決まった枠組み・メンバーの中で1を2、3へと伸ばしていくことが得意という自己分析
- 転職経験がないこともあり、「自分のやり方が他の環境でも通用するのか」という漠然とした不安もある
- タスクを次々こなしていくこと、優先順位をつけて業務を進めることも好き（プライベートでは優先順位づけが苦手）

## 7. 性格：オンオフの落差
- 仕事中は前向き・即断即決で、人間関係にもあまり悩まない
- プライベート（特にママ友付き合いなど）では、言葉の選び方一つに悩み、相手にどう思われるか気にしすぎてしまう
- 職場の同僚や上司から「顔つきが違う」「オンに入ったのがわかる」と繰り返し指摘されている

## 8. 個性心理学（動物占い）
- 本質・意思決定・表面の動物：狸／羊（コーチ・まるさんと同じ「月グループ」）＋もう1匹
- 全ての動物が「過去回想グループ」（先を心配し、慎重に一歩を踏み出すタイプ）に分類される
- 狸：基準値が高く負けず嫌い。羊：人を大切にし、チームのために動く感情タイプ
- 「なぜ自分は店長に言われて分かっていてもできないんだろう」と自分を責めるのではなく、「過去回想タイプだからこそ心配になりやすい」と性格を理解し受け入れることの重要性をコーチから伝えられた

## 9. 現職（百貨店勤務）における葛藤
- 出産前はショッピングモール系ブランドで店舗運営中心。現在は百貨店勤務で「顧客一人ひとりとの関係構築（顧客作り）」が重視される環境
- スタッフには深く寄り添えるのに、「お客様」に対しては失礼にならないか等の心配が先に立ち、踏み込めない
- 今は時間的制約もあり店長職からは一時的に離れている（声はかかるが、プライベートを犠牲にしたくないため辞退）

## 10. すりんく入会の決め手
- 入会前にコーチ（はちさん）・まるさんのインスタや配信を見て、「人を見てくれるスクールだ」という印象を持った
- 自分のペースを大きく犠牲にせずに進めていけそうだと直感的に感じたことが大きな決め手
- 数字・論理訴求よりも、感情的な発信に心が動いたタイプ（自身も「羊・過去回想」タイプで感情軸が強いため）

## 11. 直近の行動力（すでに実践していること）
- 毎朝4時半〜5時起きの練習を1週間継続し、質の良い作業時間を確保しようとしている
- 生産性・気づきを記録する日記をつけ、ChatGPTに入力して客観的に振り返る取り組みも実施
- Discordで他の受講生の動きを見て「みんな頑張っている」と刺激を受けている

## 12. 次回セッションの予定・宿題
- ワークシートの残り（特に細かく埋められなかった箇所）を、無理のない範囲で埋めておく
- 次回、時間があれば具体的にどのコンテンツを選ぶかまで決定する予定（決まらなければさらに次回へ持ち越し）
- ワークが埋まったら本人からセッションを申し込み、スケジュールを再調整する
