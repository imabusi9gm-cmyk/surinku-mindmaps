# アイリーさん 自己理解マインドマップ

## 1. セッション概要
- 自己理解は「何のコンテンツを選び、どう収益化するか」に特化。目安1〜2回、今回のアイリーさんは2〜3回ほど
- コンテンツを決めた後も、迷ったタイミングでいつでもZoomして伴走してもらえる

## 2. 自己理解ワークとの向き合い方
- 「自分の気持ちを言語化するのが苦手」という自己認識が強い（1回目・2回目とも共通の悩み）
- 感情や価値観を「この言葉で合っているか」と考えすぎて、ワークに丸一日かかることも
- コーチからのアドバイス：自己理解ワークに正解はない。頭の中をそのまま書き出す・自分と対話する感覚でOK
- 夫との会話でも同様に、言語化に時間がかかり黙り込んでしまい、喧嘩の火種になりがち

## 3. 理想の働き方
- 時間や場所に縛られず、自分の裁量でスケジュールを組める働き方（フリーランス的な理想）
- 「今日は集中できないから休憩を挟む」など、その日の状態に合わせて調整できる自由度を求めている

## 4. お金・余裕に関する自己分析
- 現在地の課題は「余裕のなさ」（お金・気持ちの両方）
- 休みの日でも「この1時間働けば◯円稼げたのに」と考えてしまい、心から休めない思考癖がある
- 大学生時代、学費が足りず友人にお金を借りた経験があり、そこから「稼がなければ」という焦りが強く根付いている
- コーチからの示唆：収入目標には天井がなく、際限なく追い求めがちなので「自分にとっての幸せ・十分だと思えるライン」を先に決めておくことが大切

## 5. 性格・特性
- 負けず嫌い（基準値が高く、他人が優遇されると悔しさを感じる。ただし悔しさをすぐ努力に転化するタイプではない）
- 大雑把・マイペース（血液型はB型。第一印象はA型に見られがち）
- 頑固：一度決めたら曲げない。喧嘩で自分が悪くても簡単には謝らない（謝ると気持ちの整理がつかないまま終わってしまうため）
- 他人の顔色をうかがいやすい：本音を言うと関係が変わるのではと考え、我慢を選びがち。ただし夫のような近しい相手には本音を溜め込まず言える
- 警戒心の強さ：信用できる人は片手で数えるほど。誰とでも仲良くなれるが、心の壁は一枚ある

## 6. 幼少期・生い立ちの背景
- 6人兄弟の2番目（長女の1つ下、妹はさらに2つ下）
- 幼少期、深夜に両親が言い争う場面を目撃したことが、父親との今も続くわだかまりの原点
- 姉との関係：お下がりを無償でなく「売られる」立場だった。姉には逆らえない力関係があった
- 進学時、姉妹の下の子たちは専門学校に進めたが、自分は情報不足もあり大学進学一択に。今も「もっと知っていれば別の道もあったかも」という思いが残る
- 褒められる経験が少なかった（勉強は姉が優秀で目立たず、特別な才能もないと感じていた）→承認欲求の強さの背景になっている

## 7. 過去の関心・派生的な興味
- 本来はスポーツジムのインストラクターを志望（栄養指導も含めて教えたかった）も、実力不足で進路変更
- 祖母譲りの足つぼマッサージが得意で家族に褒められる
- 近隣の在宅ネイルサロン（月10万円ほど安定収益、SNS集客）の存在を知り、「在宅で自分のスキルを提供する」働き方に関心を持った時期がある

## 8. 成功体験①：ゲームチームのマネージャー業（1回目セッションより）
- 「荒野行動」のチーム運営で、賞金ルームの枠を毎日確保するマネージャー業を約1年間ほぼボランティアで継続
- 金銭的対価はほぼないが、「チームが好き」「みんなが楽しんでいる姿を見るのが好き」という気持ちで継続できた
- 前面に立つより、裏方でチームを支える立場が性に合っている、という自己認識の原点

## 9. 【2回目】成功体験②：K-POPダンスグループの立ち上げ
- 大学時代、趣味でK-POPダンスグループをSNS（mixi）で募集し結成
- 東京の大規模イベントへの出演を目指すも、知名度不足で何度も落選
- メンバーの入れ替わりを乗り越えながら、「自分たちがやりたい曲」ではなく「主催側が求めている（需要のある）曲」を選び直して応募し、ついに合格
- 相手（主催者）の視点・ニーズを考えて動く力が成功につながったと自己分析。ポータブルスキルとして評価できる強み

## 10. 【2回目】モチベーションの源泉
- 「支えた相手の成功に自分が貢献できた」と言われることが一番嬉しい（＝誰かの右腕でありたい欲求）
- 褒められて伸びるタイプ。怒られるとやる気を失いやすい
- 「早く・正確に」仕事を終わらせることにやりがいを感じる（負けず嫌いな一面とも関連）
- これらの背景には、幼少期に褒められる機会が少なかった経験があると自己分析

## 11. 【2回目】半年後・1年後の目標
- 半年後：何かしら継続的な収益源を1つ確立。月3万円程度の副収入が目安
- 1年後：コンビニパートの勤務時間を減らし、在宅ワークで月5〜10万円以上を目指す
- 背景：コンビニは離職者が相次ぎ一人当たりの業務負担が増大しており、勤務時間を減らしたい事情がある

## 12. 【2回目】使える時間の把握
- 現状：コンビニパート週38〜40時間、休みは水曜・日曜（金曜は勤務時間変動の可能性あり）
- 平日：帰宅後、家事を終える20時以降に3〜4時間ほど確保可能
- 水曜（自分だけの休み）：丸1日確保できる見込み

## 13. 【2回目】検討しているコースの方向性
- 候補：オンライン秘書／インスタ運用（裏方志向）／LINE構築／デザイン（Canva）
- 夫からの後押し：ゲームマネージャー業の経験と重ねて「オンライン秘書が向いているのでは」との意見
- インスタは自分が発信者になるより、投稿制作などの裏方（運用代行）に関心が強い。ただし将来的に余裕が出たら自分も発信したい気持ちはある
- コーチからの整理：オンライン秘書・LINE構築・デザインはいずれも「裏方でクライアントを支える」ポジションで方向性は近い。同時に2つ学ぶ体力があれば並行も可能だが、インスタ運用（自分のアカウント育成）とオンライン秘書の同時進行は負荷が高いため非推奨
- 現時点でまだ最終決定はしておらず、資料を見た上で改めてLINEで意思決定を連絡する予定

## 14. 【2回目】メラルーカ（MLM）発信の検討
- 現在メラルーカ（ダイエット系サプリ等のMLM）に取り組み中。開始1ヶ月で2kg減の兆しあり
- ダイエット発信はSNSとの相性が良いジャンルとコーチも太鼓判
- 懸念：地元にいた頃から20kg以上体重が増加しており（55kg台→80kg前後）、身バレへの抵抗感が強い
- 対応方針：発信するなら最初は顔出しなしで進める。フォロワーが少ない初期段階は身バレのリスクが実質低いこともコーチが説明し、本人の不安を軽減

## 15. アクションアイテム／次のステップ
- [ ] （1回目宿題・完了）自己理解ワークシートを最後まで埋める
- [ ] スリンクの各コース資料を確認し、進めるコース（オンライン秘書／インスタ／LINE構築／デザイン）の優先順位をLINEで連絡する
- [ ] 資料を見て追加の疑問点があれば都度質問する
- [ ] コース決定後、初期設定・研修フェーズへ進む
