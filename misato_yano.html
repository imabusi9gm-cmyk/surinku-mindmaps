# みさとさん 自己理解マインドマップ

## 1. セッション概要
- 自己理解セッションは1〜2回を予定。今後発信するコンテンツの方向性を一緒に決めていくのが目的
- 今後迷ったときはいつでもZoomを組んでOKという前提
- 今回は性格・価値観を中心に深掘り。次回は「得意なこと」と「コンテンツ内容の決定」まで進む予定

## 2. ワーク進捗
- 動画視聴済み。人生の優先順位を改めて認識できた
- 52ページのワークは途中まで進行中。答えやすいところから記入
- 書きにくかった項目：家族・パートナー、自然関係、マインド、健康美容（夫との出来事の影響で空白のまま）
- 書きやすかった項目：学び・自己投資・仕事・お金・一人の時の暮らし

## 3. 現在の状況（プライベート）
- 妊娠8ヶ月
- 今年3月に夫の不倫が発覚。相手との子供の中絶もあった
- 4年間の別居を経て、翌日夫が帰宅予定。夫婦再構築の方向で進んでいる
- 夫婦再構築の講座（カウンセラー伴走型）に参加中。自分のマインド・思考パターンを見直している
- 会社でも上司の不倫問題に巻き込まれ精神的に追い詰められ、1週間休職した経験あり
- 8月20日から産休、約1年間の育休を取得予定
- 更年期障害・うつ症状のような不調も出てきている

## 4. 理想の暮らし・働き方
- 経済的自立が最大の理想。買い物や旅行を夫に頼らず自分のお金で賄えるようになりたい
- 本業（正社員）で安定収入を確保しながら、副業でまず月3〜5万円の収入を目指すスモールステップ志向
- 育児と仕事を両立するため、在宅ワークや自宅近くで働ける環境を将来的に構築したい
- 「お帰り」と言える環境を子供に作ってあげたい（専業主婦だった自身の母親からの原体験）
- シングルマザーで副業収益を大きく伸ばしているインスタグラマーに刺激を受けている

## 5. キャリア遍歴
### 1社目：ワイン・お酒専門商社（営業）
- ソムリエ資格取得。好きなものを扱う仕事で充実
- 信頼していた社長の退任を機に退職
### 2社目：お酒業界（営業・出張多め）
- 夫の単身赴任決定と多忙さを機に退職
### 3社目（現職）：建築業向けITサポート会社の事務職
- 自宅から自転車5分。もともとIT・建築に全く興味がなかったが、自分なりに楽しめるようになった

## 6. 価値観・強み
- 人間関係を仕事の軸に置く：職場の人間関係が悪いと続けられない。仕事内容自体はどんなものでも楽しめる
- 負けず嫌い：中高6年間のダンス部での選抜経験から培われた
- 経済力でも「男性に負けたくない」「夫に頼りたくない」という強い動機につながっている
- 継続力：ダンス部6年間、アルバイト4年間継続など、始めたことをやり切る力がある
- 何事も楽しむ精神：興味のない仕事でも自分なりに工夫して楽しめる。ポータブルスキルとして高く評価された
- 直感力・行動力：考えすぎず飛び込む。恵比寿でのアルバイト、すりんく参加なども直感で即決

## 7. 個性心理学（動物占い）
- 本質・意思決定・表面すべてが「未来展望グループ」（子鹿・狼）
- 「こうなったらどうしよう」と考えず、面白そうならまずやってみるタイプ。自己認識とも一致

## 8. 営業 vs 事務の比較
- 営業の良かった点：対面での顧客関係構築、成果が目に見える達成感、頑張りが報酬に直結
- 事務の良かった点：電話・メールでの伝達スキル向上、業務整理・Excel等の内部スキル習得、対応できる業務の幅が大きく拡大
- 両職種に共通するやりがい：「お客さんに喜んでもらうこと」

## 9. 次回セッションの予定
- 得意なこと・仕事での好きなポイント・過去の成功体験を深掘り
- その後、コンテンツの方向性を具体的に決める
