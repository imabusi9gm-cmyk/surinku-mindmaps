# みさとさん 自己理解マインドマップ

## 1. セッション概要
- 自己理解セッションは1〜2回を予定。今後発信するコンテンツの方向性を一緒に決めていくのが目的
- 今後迷ったときはいつでもZoomを組んでOKという前提
- 今回は性格・価値観を中心に深掘り。次回は「得意なこと」と「コンテンツ内容の決定」まで進む予定

## 2. ワーク進捗
- 動画視聴済み。人生の優先順位を改めて認識できた
- 52ページのワークは途中まで進行中。答えやすいところから記入
- 書きにくかった項目：家族・パートナー、自然関係、マインド、健康美容（夫との出来事の影響で空白のまま）
- 書きやすかった項目：学び・自己投資・仕事・お金・一人の時の暮らし

## 3. 現在の状況（プライベート）
- 妊娠8ヶ月
- 今年3月に夫の不倫が発覚。相手との子供の中絶もあった
- 4年間の別居を経て、翌日夫が帰宅予定。夫婦再構築の方向で進んでいる
- 夫婦再構築の講座（カウンセラー伴走型）に参加中。自分のマインド・思考パターンを見直している
- 会社でも上司の不倫問題に巻き込まれ精神的に追い詰められ、1週間休職した経験あり
- 8月20日から産休、約1年間の育休を取得予定
- 更年期障害・うつ症状のような不調も出てきている

## 4. 理想の暮らし・働き方
- 経済的自立が最大の理想。買い物や旅行を夫に頼らず自分のお金で賄えるようになりたい
- 本業（正社員）で安定収入を確保しながら、副業でまず月3〜5万円の収入を目指すスモールステップ志向
- 育児と仕事を両立するため、在宅ワークや自宅近くで働ける環境を将来的に構築したい
- 「お帰り」と言える環境を子供に作ってあげたい（専業主婦だった自身の母親からの原体験）
- シングルマザーで副業収益を大きく伸ばしているインスタグラマーに刺激を受けている

## 5. キャリア遍歴
### 1社目：ワイン・お酒専門商社（営業）
- ソムリエ資格取得。好きなものを扱う仕事で充実
- 信頼していた社長の退任を機に退職
### 2社目：お酒業界（営業・出張多め）
- 夫の単身赴任決定と多忙さを機に退職
### 3社目（現職）：建築業向けITサポート会社の事務職
- 自宅から自転車5分。もともとIT・建築に全く興味がなかったが、自分なりに楽しめるようになった

## 6. 価値観・強み
- 人間関係を仕事の軸に置く：職場の人間関係が悪いと続けられない。仕事内容自体はどんなものでも楽しめる
- 負けず嫌い：中高6年間のダンス部での選抜経験から培われた
- 経済力でも「男性に負けたくない」「夫に頼りたくない」という強い動機につながっている
- 継続力：ダンス部6年間、アルバイト4年間継続など、始めたことをやり切る力がある
- 何事も楽しむ精神：興味のない仕事でも自分なりに工夫して楽しめる。ポータブルスキルとして高く評価された
- 直感力・行動力：考えすぎず飛び込む。恵比寿でのアルバイト、すりんく参加なども直感で即決

## 7. 個性心理学（動物占い）
- 本質・意思決定・表面すべてが「未来展望グループ」（子鹿・狼）
- 「こうなったらどうしよう」と考えず、面白そうならまずやってみるタイプ。自己認識とも一致

## 8. 営業 vs 事務の比較
- 営業の良かった点：対面での顧客関係構築、成果が目に見える達成感、頑張りが報酬に直結
- 事務の良かった点：電話・メールでの伝達スキル向上、業務整理・Excel等の内部スキル習得、対応できる業務の幅が大きく拡大
- 両職種に共通するやりがい：「お客さんに喜んでもらうこと」

## 9. 1回目：次回セッションの予定
- 得意なこと・仕事での好きなポイント・過去の成功体験を深掘り
- その後、コンテンツの方向性を具体的に決める

## 10. 1回目のアクションアイテム
- [ ] 美里さん：ワーク（52ページ）の残りを進め、特に得意なこと・仕事での成功体験のページを埋める
- [ ] 美里さん：「仕事をしていて好きだったポイント・頑張れた理由」を次回までに整理しておく
- [ ] ワーク完了後、次回セッションのZoomを設定する

## 11. 【2回目】近況・体調
- 夫が帰宅し久々の夫婦生活を再開。その後もプライベートで大変なことがあり体調を崩した経緯がある
- 一人でも生きていける体制を整えたいという思いが、夫の帰宅を機により明確になった
- 8月20日頃から産休入り、出産予定は9月26日。里帰り出産のため数日後に実家（千葉）へ移動予定
- 10月の東京イベント参加を希望していたが、出産直後のため難しいと自覚

## 12. 【2回目】強み：業務効率化・業務改善
- 1社目〜現職まで一貫して「無駄な作業を見つけて改善する」提案を行ってきた
- マニュアル作成が得意：口頭説明のみだった教育プロセスを资料化し、教える側・教わる側双方のストレスを軽減
- コーチのフィードバック：AIが台頭する時代において「自ら提案し改善できる人材」は今後さらに重宝される。在宅ワークでもクライアントに喜ばれる強みになるとの後押し

## 13. 【2回目】成功体験①：メニュー作成の会社的な仕組み化（1社目）
- 個人事業主の飲食店向け営業活動の中で、パワポ等でメニュー作成を代行していたが、品質のばらつき・時間的コストが課題と気づく
- 「営業企画部で巻き取るべき」と会社に提案し、実際にPhotoshopが使える人材に業務移管。個人の力量ではなく会社全体の営業ツールとしてレベルアップさせた

## 14. 【2回目】成功体験②：現職での業務改善（IT企業の事務職）
- アナログな紙ベース＋PDF化という非効率な顧客管理フローを、共有可能なスプレッドシート管理に変更
- 電話でのやり取りが個人に属人化し顧客対応品質にばらつきが出る課題に対し、ログ管理の導入を提案
- 個人メールでのやり取りをチーム共有アドレスに変更するなど、複数の業務改善を主体的に実行

## 15. 【2回目】コンテンツ検討の広がり
- 気になっているコンテンツ：オンライン秘書、インスタ（動画編集スキル）、営業代行
- インスタは自分の発信よりも「運用代行」志向。将来的には自身のノウハウを使った発信も視野に入れている

## 16. 【2回目】出産・育児を踏まえた収入目標の変化
- 当初は本業と並行してお小遣い程度（月1〜3〜5万円）を想定していたが、夫の帰宅を機に「いつ仕事を辞めても困らない金額」を目指す方向に意識が変化
- 自宅から徒歩10分の現職は、万一夫と離婚し実家に戻る場合は通勤が困難になるため、育休明けに退職する可能性も視野に入れている
- 先輩ママ（育休中に物販・動画編集等を開始し3年で7桁収入）の事例に刺激を受け、里帰り出産で親のサポートを受けながら本気で取り組みたいという決意

## 17. 【2回目】営業代行の検討
- コーチの見立て：これまでの営業経験・話し方から、オンライン営業代行への適性が高いと評価
- 懸念点：赤ちゃんがいる生活の中で決まった時間枠（1〜2時間）を確保できるか、Zoom中に子どもが泣き出す可能性など、育児と両立できる働き方かどうかが未知数
- 対応策として、母親（保育士）のサポートが期待できる夜19時〜就寝、および土日の時間帯に絞って対応可能な営業代行の形があるか、営業代行講師（小林氏）に確認することに

## 18. 【2回目】インスタ運用代行の検討・練習方法
- 動画編集の経験はまだないため、まずは自分が趣味で運営している犬（ポメラニアン）のインスタアカウントを練習台として活用する提案
- 新規アカウントを一から作る初期設定の手間を省きつつ、動画編集・投稿・フォロワーの反応などの実践感覚を養うことができる
- スリンクの知人企業からの動画編集・台本作成の外部案件（時給1,800〜2,500円相当、1ヶ月無償研修あり）にも、練習後に成果物を提出して応募できる可能性

## 19. 【2回目】コンテンツ選定の方向性
- 選択肢はインスタ（運用代行）か営業代行のいずれかにまず絞り込み。動画編集の経験・スキルが浅いため、秘書よりはインスタが向いていると判断
- 本人の希望：条件を度外視すれば営業代行をやりたい。理由は「早く自分の人生を切り拓く一歩を踏み出す勇気が欲しい」「成果報酬型の方がやる気が出るタイプ」という自己分析（過去の営業でも歩合・ボーナスのために頑張れた経験あり）
- 営業代行の実現可能性を小林氏に確認した上で、難しければまずインスタに切り替え、落ち着いてから営業代行に挑戦する順番も検討

## 20. 【2回目】作業環境の準備
- スケジュール管理はGoogleカレンダーを使用中（コーチ・まるさんとの共有にも活用しやすい）
- 数年前に購入したMacBookを保有しており、在宅ワークではMac・Google系ツール（スプレッドシート、ドキュメント、ドライブ）が主流であることを確認
- 最初から機材を揃えすぎる必要はなく、まずはMacBook一台で十分。作業しやすさ向上のためトラックボールマウスや、営業代行で画面共有をしながら資料を見る場合の外部モニター等は必要に応じて追加投資を検討
