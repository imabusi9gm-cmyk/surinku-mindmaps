# まなみさん（宮地愛美）自己理解マインドマップ

## 1. セッション概要
- 台風の影響による自宅wifi不調で接続に不安があったが、リスケせず実施
- 迷うこと・コンテンツ追加などで悩むことがあれば、いつでも連絡・セッション相談可能という前提を確認
- 今日と次回の2回で、まなみさんのコンテンツを一緒に決めていく計画

## 2. 近況・体調
- スリンク入会後、股関節の治療が一旦終わり、その後放射線治療が平日毎日約1ヶ月続いていた
- 治療期間中は仕事にも行きながらの生活で、なかなか自分の作業に手が回らず、ワークが進められない状態が続いていた
- 9月上旬に放射線治療が終了し、一旦落ち着いたことで「動き出さないと」という気持ちになってきている
- 体調はだいぶ安定してきている

## 3. ワークの進捗
- 動画視聴は完了しているが、「得意を見つける」以降のワークはまだ手つかず
- 今回は理想の暮らし・働き方や現在地の部分を中心に扱い、得意なこと以降は次回に持ち越し

## 4. 理想の暮らし・働き方
- 理想は「時間に追われてバタバタしない」「心に余裕を持てる」こと
- 現状は外で働いており、お迎え時間に間に合わせるため子どもを急かしてしまい、気持ちに余裕がなくなっていく
- 家で働くようになっても仕事の開始時刻へのプレッシャーは残るのではという懸念もあり、「時間に追われない」を具体化しきれていない部分は今後の課題

## 5. スリンク入会の目的：収入アップ
- 入会の一番の目的は収入を増やすこと
- 通院で出費がかさんでいく中、収入が増えれば生活にゆとりが生まれ、通院自体への抵抗感も減るという思い

## 6. お金を通じて叶えたいこと：子どもの選択肢を広げる
- 子どもが将来習い事をしたいと言った時に、月謝の高さを理由に躊躇せず「やりたいならやっていいよ」と言ってあげたい
- 生活の厳しさで子どもの選択肢を狭めたくないという強い思い

## 7. 自分自身への想い
- 自分自身についても、気に入った服が多少高くても買えるようになりたい
- 美容関連にも自分でお金を使えるようになりたい
- プラスの収入目標としては月10万円程度を希望

## 8. 来月鹿児島へ引っ越し・環境変化
- 来月、夫の転勤の可能性を見据えて鹿児島へ引っ越し予定。引っ越し後は一旦無職になる見込み
- 元々は上の子が小学校に上がるタイミング（来年）で鹿児島に戻る想定だったが、夫の転勤時期が確定しないまま今回引っ越しを前倒しすることになった
- 現在は週4日のパート勤務（放射線治療中は午前休をもらい調整していた）
- 子どもは6歳（年長）と4歳（年中）

## 9. 引っ越し後の理想の働き方
- 治療がまだ完全に終わっていないこともあり、正社員は難しいと判断し、パートを希望
- 理想は「週3日程度のパート＋在宅ワーク」の組み合わせ
- 鹿児島到着後、いつパートが決まるかも未定なため、当面は無職期間・不安定な期間が続く見込み

## 10. 価値観ワークの振り返り
- 理想の部分は「こうだったらいいな」がスラスラ書けた一方、後から振り返ると具体的すぎたかもと感じている
- 価値観ワーク後半のポジティブ・ネガティブな過去の経験を書く項目では手が完全に止まってしまった
- 特にネガティブな経験は「思い出すと暗い気持ち・重い気持ちになりたくない」という無意識のブロックがかかり、書けなかったと自己分析

## 11. 性格：引っ込み思案・自分の意見を言わない
- 明るいタイプではなく、引っ込み思案。自分の意見を主張することが少ない
- 年齢を重ねるにつれ「そもそも自分の意見を持っていないのでは」と感じることが増えてきた
- 「言っても自分の意見は通らないだろう」という諦めから、「どっちでもいい」と流すことが多い
- 揉めごとや複雑になることを避けたい気持ちが強く、我慢してでも黙っている方が楽だと感じている
- 自分の考えを言葉にするまでに時間がかかり、その間に周囲の話がどんどん進んでしまう経験が多い（例：Zoomのチャットで発言が出遅れる）

## 12. 個性心理学：羊タイプ
- コーチの診断により「羊」タイプと判明
- 羊は熟考してから発言するタイプで、チャットへの反応が早い動物（ペガサス・チーターなど）と比べて遅く見えるが、それ自体は欠点ではないという説明
- 言語化力を鍛える方法として、日記やジャーナリングを毎日書く習慣を提案

## 13. 性格：完璧主義・うまくいかないと崩れる
- 複数のタスクが重なったり、思い通りにいかないことが続くと「もう無理」と手が止まってしまう傾向
- 具体例：出発前に子どもがぐずったり忘れ物をしたりと小さなつまずきが積み重なると、それだけで「今日はもう活用できない」と諦めてしまう

## 14. スリンクでの過去の停滞・向き合い方の課題
- 入会後、手術や治療が重なったこともあり、病気を理由にワークから逃げてしまっていた部分が大きかったと自己分析
- 「うまくいかなかったら無理」という先の性格傾向と、過去の停滞がつながっていることに気づく

## 15. コンテンツ選定への示唆：外部の納期・構造がある仕事への適性
- 自己管理・自発的に動く形（インスタの自分アカウント運用など）は自分には向いていないのではという不安を吐露
- コーチより、在宅ワークの多くは実際には納期や依頼元がある仕事（運用代行・オンラインショップ運営など）であり、「できませんでした」が許されない構造がある点を説明
- インスタの自分アカウント運用だけは唯一、外部からの管理がなく自己管理に委ねられる領域であるため、その点を踏まえてコンテンツを検討する方針

## 16. モチベーションの源泉
- 「みんな頑張っているから自分も頑張ろう」と感じるタイプで、周囲の頑張りに触発されてやる気が上がる
- スリンクでの活動（Zoom対応、講義、募集のための発信など）自体は、キャリアに悩む人の選択肢を増やしたいという思いと重なっており、苦ではないと感じている

## 17. 次回セッションへの持ち越し
- 次回は「得意なこと」以降のワークを最後まで実施予定
- 今回の性格傾向（完璧主義・外部構造への適性）を踏まえ、コンテンツの方向性を引き続き検討
