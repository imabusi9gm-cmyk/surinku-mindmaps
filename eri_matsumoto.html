# エリさん 自己理解マインドマップ

## 1. セッション概要
- 自己理解は「何のコンテンツを選ぶか・どういう目標でやっていくか」を決めるのが目的。初回は1〜2回のセッションを予定
- コンテンツ決定後も、インスタのアカウント方向性などで迷った際はいつでもZoomして相談できる

## 2. 自己理解ワークとの向き合い方
- 「頑張った経験は？」「努力してきたことは？」という質問に対して、パッと答えが出てこない
- 「自分は大したことをやっていない」という感覚が根底にある

## 3. 理想の暮らし・働き方
- 場所に縛られない自由な働き方が理想（2拠点生活や海外での親子留学に憧れ）
- 子どもといろいろな経験（ライブ、旅行など）を気軽にできるようになりたい
- 自分一人でも子どもを連れて自由に出かけられる状態を望んでいる

## 4. 現状（自己評価）
- 現在の満足度は自己評価で約30%
- 一番の課題は「お金の不足」。会社に縛られている感覚があり、やりたいことがあっても我慢しがち
- お金の不安が解消されれば、理想の状態に近づけると感じている

## 5. お金を作る上で求める仕事の条件
- 人間関係で苦しまない、自分が苦にならない仕事
- 好きなこと・得意なことを磨いて伸ばしていけること
- 家でもどこでも、旅行中でも働けるような場所に縛られない働き方

## 6. 性格：自分優先になりがちな一面
- 「やりたいと思ったらやりたい」「寝たいときは寝たい」など、自分の欲求を優先しがちな自覚あり（本人曰く「子供っぽい」）
- 学びの時間を子どもとの時間より優先してしまい、子どもに「ママ」と呼ばれても後回しにすることも
- 子どもとうまく遊べていないことに軽い罪悪感を持っている

## 7. 自信のなさの背景
- 「何かを一生懸命頑張り、乗り越えた」という経験があまりない自覚。受験も試験を避けて推薦入試を選ぶなど、なるべく困難を回避してきた傾向
- 過去に始めた副業（物販等）も継続できなかった経験があり、「自分は何をやってもうまくいかない」という思いにつながっている
- コーチも自身の似た経験（推薦入試・自信のなさ）を共有し、「0→1の達成体験を積み重ねることで自信はついていく」と伝えている

## 8. 価値観ワークで見えたキーワード
- 「周りに気を使えない人が嫌」というフレーズが繰り返し登場
- 深掘りすると、裏側にあるのは「チームワーク・周囲との調和を大切にしたい」という価値観
- チームで売上を上げる場面でも、個人プレーより「メンバーの得意を活かして助け合う」やり方を好む

## 9. 個性心理学（動物占い）
- 本質：ペガサス（興味を持つとすぐ飛びつくが、飽きたら手放しやすいタイプ）
- 意思決定：たぬき（チームワーク・調和を重視するグループ）
- 過去回想（慎重）と未来展望（飛び込み型）の両方の要素を併せ持ち、場面によって出方が変わる自己分析と一致

## 10. 裏方志向・サポート気質
- 前職でも「上に行きたくない」「人に頼られたくない」という意識があり、先輩のサポート役でいることを好んだ
- 人に何かを指導する立場より、裏方で細かく支える立場の方が得意で心地よいと自己分析

## 11. インスタ発信（片付けアカウント）の現状
- 「稼げそうだから」という動機で片付けジャンルの発信を開始。自分自身が心から出したい思いがあるわけではないと自覚
- 長文で思いを届けるタイプの発信が苦手。片付けというジャンル自体への熱量の低さも影響している可能性

## 12. プロダクトアウト型・マーケットイン型の自己分析
- コーチの整理：「マーケットイン型」＝需要のある市場に合わせて動けるタイプ、「プロダクトアウト型」＝自分がやりたいと思えないと続けられないタイプ
- エリさんは完全にプロダクトアウト型。稼げても思い入れのないジャンル（片付け等）だと途中で息切れするリスクがあるとコーチが指摘
- 自社商品を持つ場合も、ジャンル選びは「稼げるか」だけでなく「自分が続けられるか」を重視する必要がある

## 13. 自社商品への憧れとその実態
- 「自分の商品を持つのがかっこいい」という漠然とした憧れはある
- 一方で「人の上に立ちたい」「教えるのが得意」というタイプではなく、自信のなさもあり、今すぐ自社商品を主軸にすることには積極的でない

## 14. これまで学んできたこと
- インスタ運用、コンテンツ販売、片付けスクール（片付けジャンルでの自社商品化を見据えて受講）

## 15. 興味の方向性：おすすめ・紹介型のスタイル
- コンテンツ販売（自分の商品を作る）よりも、「良いと思った商品を人におすすめする」スタイル（アフィリエイト寄り）の方が自分に合うと感じている
- 背景：楽して良いものに頼りたい性分、良い商品をリサーチして見つけるのが好き

## 16. 収益に関する希望
- 大きな収入の波（自社商品ローンチ型のドカンと入る収益）より、毎月安定した収入を希望
- 目安として毎月50万円ほどの安定収入を望んでいる。収入がいきなりゼロになることへの不安が強い

## 17. コーチが紹介した収益モデルの実例
- 運用代行（契約期間中は収益が安定するベース収入）＋自社商品／固定案件／単発案件（ボーナス的な収入）を組み合わせる働き方
- 固定案件は完全に先方都合でコントロールしづらいため「ボーナス」として捉えるのが良いという考え方を共有

## 18. 現時点での結論・優先順位
- 自社商品を主軸にしたいというより、まずはスキルを磨いて安定した収入を得ることを最優先したい
- インスタは「運用代行の実績・名刺代わり」として続ける方向には前向き
- 動画編集自体は苦ではないが、撮影作業には抵抗感（億劫さ）がある

## 19. 案件の希望条件
- 単発の仕事より、長期で継続する案件を希望
- 例：LINE構築などは単発案件が多い傾向があるため、コース選択時に「単発か継続か」も判断材料にしたい

## 20. 1回目の宿題・次回の予定
- 得意なこと発見ワーク（成功体験の深掘りを含む）に取り組む。「成功体験」のハードルを大きく下げ、ごく小さな「うまくいったかも」という出来事でも書き出してみる
- ワークが埋まったら本人から連絡し、次回セッションを設定。次回は得意なことの深掘りに加え、時間があればコンテンツの最終決定まで進める予定

## 21. 【2回目】ワーク再挑戦・向き合い方
- 「自分がどうしたいのか」がいまいち分からない状態が続いており、得意なことも相変わらずパッとは出てこない
- ただし「時間に縛られるのが苦手」という気づきを得る。理想の働き方の背景には、子どもの急な対応や旅行のしやすさなど柔軟性への欲求があると自己分析

## 22. 【2回目】性格：計画性は場面によって偏りがある
- 旅行（ディズニー等）の計画を立てるのは好きで、以前はショーの時間から逆算して回るルートを綿密に決めていた（子どもが生まれてからは柔軟に変化）
- 一方、仕事に関しては計画的に進めるよりも「言われたことをこなす」方がストレスなくできるタイプ
- 接客・ジム派遣の経験から、決まった型・指示に沿って進める仕事の方が向いていると自己分析

## 23. 【2回目】仕事への向き合い方：「仕事は仕事」という割り切り
- 過去に占いで「仕事を楽しめないタイプ、仕事は仕事と割り切った方がいい」と言われた経験があり、それが根付いている
- 副業も含め「全部苦手だったかもしれない」と振り返るが、コーチの提案で「人と話すのは良かった」など経験を細分化して捉え直す視点を得る
- 商品発注やレジ業務など、淡々とこなす単純作業には苦がないタイプと自己分析

## 24. 【2回目】成功体験①：合唱コンクールでの金賞
- 中学時代、合唱コンクールの選曲係を担当。「今までと同じ曲は嫌」という気持ちから新しい・インパクトのある曲を先生と相談して選定し、金賞を獲得
- 「人と違うことをしたい」「新しいことに挑戦したい」というワクワク感が原動力だったと振り返る
- コーチの分析：個性心理学の本質タイプ「ペガサス」（興味を持つとすぐ飛びつく）の資質が強く出ていたエピソード

## 25. 【2回目】成功体験②：ダイエットでの15kg減量
- 一人暮らし時代、歯列矯正による食事制限も重なり15kgの減量に成功（本人は「たまたま」と謙遜）
- 過去のダイエットは継続できなかったことが多く、「自分で決めてやり切る」タイプではないと自己分析
- 周囲（職場の同僚の美容習慣など）の影響を受けて行動を変えるパターンがあることにも気づく

## 26. 【2回目】モチベーションの源泉
- 良くも悪くも周囲の影響を受けやすいタイプで、一人で黙々と取り組むより周囲に人がいる環境の方が力を発揮しやすい
- コーチの助言：フリーランスやインスタ発信のように孤独になりやすい働き方では、モチベーションが下がった時に戻せる「自分なりの源泉（作業会参加、オフ会参加など）」を把握しておくことが重要

## 27. 【2回目】自社商品の位置づけの変化
- 「片付け」ジャンルへの熱量が低いと自覚し、自社商品の優先度は大きく下がった
- 単価の高さへの憧れはあったが、コーチから「自社商品はローンチ月に収益が偏りやすく、年間平均すると必ずしも高収入とは言えない」「集客を継続する大変さ」を説明され、収益の安定性を重視する方向に納得

## 28. 【2回目】収益モデルの比較・方向性決定
- 運用代行（契約期間中は収益が安定）／LINE構築（単発案件が多い傾向）／デザイン（案件の有無に波がある）を比較検討
- 最も安定性が見込めるインスタ運用代行を軸にすることを決定

## 29. 【2回目】現状使える時間
- 平日週2日（木・金）は子どもを預けて日中4〜5時間、それ以外の日は朝晩合わせて3時間程度が使える時間
- 今月から子どもの通園が始まったばかりで、副業に充てられる時間が増え始めた段階

## 30. 【2回目】コンテンツ決定：インスタ運用代行
- 秘書業務とインスタ運用代行を将来的に掛け合わせる可能性はあるが、まずはインスタ1本に集中することに決定
- 自分のアカウント（片付け）は当面動かさず、クライアントワークでリール・ストーリーズのスキルを磨いた上で、必要に応じて自分の発信にも活かす方針
- 目標：半年〜1年後に月30万円の収益化。インスタ運用代行以外の仕事（オンライン・オフラインとも）は行わず、これ一本に集中する

## 31. 【2回目】インスタ研修の進捗と気づき
- 「開業1年目にやることリスト」というテーマでリール制作に挑戦し苦戦。自分自身の経験だとフィード投稿向きの内容になり、リールに落とし込みにくかった
- 伸びている投稿のリサーチも、「誰のためのアカウントか」という対象読者の設定がない状態では世界観を定めにくく難しさを感じた
- コーチの助言：クライアントワークでは対象アカウントの世界観に合わせてリサーチできるようになる。最初はリサーチに時間がかかっても、量をこなすことで自分なりの効率化ポイントが見えてくるという考え方を共有

## 32. 【2回目】今後の学習体制
- インスタコンテンツ受講で使えるオンクラス教材（リサーチ方法・初期設定など）を活用しながら学習を進める
- 9月17日または18日予定のインスタ勉強会への参加を推奨される
- 分からないことはいつでもコーチに質問してよいことを確認し、量をこなしながらスキルアップしていく方針
