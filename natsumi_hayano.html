# 夏さん（早野夏美）自己理解マインドマップ

## 1. セッション概要
- すりんくの自己理解セッションは最初の1〜2回（人により回数は異なる）で実施
- 目的：性格・価値観・得意なことを整理し、最終的にどのコンテンツを選ぶかを一緒に決める
- 自己理解は1回で完結するものではなく、コンテンツ選定後も迷い・悩みが出た際はいつでもZoomセッション可能

## 2. 自己理解ワークとの向き合い方
- 事前ワーク・自己理解コンテンツを見た感想：「めっちゃ難しかった」
- 難しさの理由：自分が何を持っているか分からない、考えたことのない質問が多く、考えても出てこないことが多い
- 幼少期の記憶がほとんどなく、思い出すのに苦労した／楽しいことを聞かれても手が止まった
- コーチの見立て：日々の家事・仕事・子育ての中で自分の感情に向き合う時間がなく、「楽しい」「イライラ」で感情が止まってしまい、深掘りできていないことが原因
- 今後のトレーニング：感情が動いた瞬間を書き出し、「なぜそう思ったのか」を考え、言語化する習慣をつける

## 3. 理想の暮らし・働き方
- お金の不安をなくしたい／子育てを優先した働き方をしたい（幼稚園の制度を活用しつつ子どもに負担をかけない）
- お金の不安の具体化：月5万円の余裕があれば急な出費に対応できるかと考えるが、「言い出したらキリがない」ことに自ら気づく
- コーチのフィードバック：お金の不安は金額では解消されず、お金の知識をつけることで「これだけあれば大丈夫」と腑に落ちる状態を作ることが解決につながる

## 4. 収入目標
- 本業＋副業合わせてトータル月15万円を稼ぎたい
- 目的：万一離婚しても子どもと一緒に一人でやっていける状態を作りたい
- 叶えたい未来の状態：お金を気にせず自分が選びたい方を選べる（例：コンビニでハーゲンダッツを選べる）

## 5. 現状の満足度
- 総合満足度は自己評価70点。人間関係やパートの仕事内容には満足しているが、収入面で満足できていない
- 現在の本業収入は月5〜7万円。あと月8万円ほどを自分で稼ぐ力が必要という認識
- コーチより：在宅ワークの学びの過程で目的を見失うことがあるが、「離婚しても子どもと選べる自分でいたい」という理想を忘れずに続けてほしいとの助言

## 6. 性格：優柔不断・決められない
- 基本的に「何でもいい」「どっちでもいい」が多く、自分の意思がないと感じている
- 決めるのに時間がかかり、決めること自体が嫌。理由は「後から文句を言われて責任を取りたくない」から
- 背景：3人兄弟の真ん中で姉のお下がりを着て育ち、自分で選ぶ経験が少なかったのではと自己分析

## 7. 性格：受け身の人生選択とすりんく入会の意味
- 進路など人生の選択は基本的に親の意見に沿って決めてきた。自分発信で何かをやった経験はほとんどない
- 現在の職場（パート）も時間や休みなど条件で選んだだけ
- すりんく入会は「初めて自分の意思で決めたこと」と自覚。占い（獅子座の下半期運勢＝「この夏、失敗したことに再チャレンジすると良い」）と過去の在宅ワーク挫折、コーチのインスタグラムがきっかけで再挑戦を決意
- コーチのフィードバック：占いがきっかけでも、実際に行動を選んだのは本人の意思であり、大きな一歩

## 8. 性格：めんどくさがり・楽観的（長所として言語化）
- 家事は手を抜くタイプ。掃除は「見えるところが綺麗ならOK」で後回しにすることもある
- 子育てでも、ダメなことは線引きしつつ、多少のことは「まあいいか」と力を抜いて対応
- コーチのフィードバック：完璧主義にならず楽観的に構えられるのは長所。コントロールできないことにイライラしすぎず、ストレスを溜めにくい性質

## 9. 価値観
- 働く上で大事にしたいこと：人との関わり方・チームワーク（一人で働いた経験がないため）
- 人生で大事にしたいキーワード：自分の意思で選択すること、自分の気持ち・やりたいことを尊重すること
- 「自分で選べる自分」に対する自信を持ちたいという願望

## 10. 緊張・不安について
- セッション中もキックオフ時も一貫して緊張していると発言。理由は「未知の世界で何が起こるか分からないから」
- コーチの助言：コンテンツを決めて学びを進める中で少しずつ理解が深まっていくので心配しなくて大丈夫

## 11. 宿題・次回セッションの予定
- 成功体験を見つけるワークに再チャレンジ：大きな成果でなくてよく、「うまくいったな」と思える小さなことをハードルを下げて書き出す
- 過去の出来事を深掘りし、得意なことにつながる成功体験を何個か書き出せたら本人からLINEで連絡
- 連絡が来たら次回セッション（2回目）を設定し、成功体験の深掘りとコンテンツ決定に向けて進める予定
