# 夏さん（早野夏美）自己理解マインドマップ

## 1. セッション概要
- すりんくの自己理解セッションは最初の1〜2回（人により回数は異なる）で実施
- 目的：性格・価値観・得意なことを整理し、最終的にどのコンテンツを選ぶかを一緒に決める
- 自己理解は1回で完結するものではなく、コンテンツ選定後も迷い・悩みが出た際はいつでもZoomセッション可能

## 2. 自己理解ワークとの向き合い方
- 事前ワーク・自己理解コンテンツを見た感想：「めっちゃ難しかった」
- 難しさの理由：自分が何を持っているか分からない、考えたことのない質問が多く、考えても出てこないことが多い
- 幼少期の記憶がほとんどなく、思い出すのに苦労した／楽しいことを聞かれても手が止まった
- コーチの見立て：日々の家事・仕事・子育ての中で自分の感情に向き合う時間がなく、「楽しい」「イライラ」で感情が止まってしまい、深掘りできていないことが原因
- 今後のトレーニング：感情が動いた瞬間を書き出し、「なぜそう思ったのか」を考え、言語化する習慣をつける

## 3. 理想の暮らし・働き方
- お金の不安をなくしたい／子育てを優先した働き方をしたい（幼稚園の制度を活用しつつ子どもに負担をかけない）
- お金の不安の具体化：月5万円の余裕があれば急な出費に対応できるかと考えるが、「言い出したらキリがない」ことに自ら気づく
- コーチのフィードバック：お金の不安は金額では解消されず、お金の知識をつけることで「これだけあれば大丈夫」と腑に落ちる状態を作ることが解決につながる

## 4. 収入目標
- 本業＋副業合わせてトータル月15万円を稼ぎたい
- 目的：万一離婚しても子どもと一緒に一人でやっていける状態を作りたい
- 叶えたい未来の状態：お金を気にせず自分が選びたい方を選べる（例：コンビニでハーゲンダッツを選べる）

## 5. 現状の満足度
- 総合満足度は自己評価70点。人間関係やパートの仕事内容には満足しているが、収入面で満足できていない
- 現在の本業収入は月5〜7万円。あと月8万円ほどを自分で稼ぐ力が必要という認識
- コーチより：在宅ワークの学びの過程で目的を見失うことがあるが、「離婚しても子どもと選べる自分でいたい」という理想を忘れずに続けてほしいとの助言

## 6. 性格：優柔不断・決められない
- 基本的に「何でもいい」「どっちでもいい」が多く、自分の意思がないと感じている
- 決めるのに時間がかかり、決めること自体が嫌。理由は「後から文句を言われて責任を取りたくない」から
- 背景：3人兄弟の真ん中で姉のお下がりを着て育ち、自分で選ぶ経験が少なかったのではと自己分析

## 7. 性格：受け身の人生選択とすりんく入会の意味
- 進路など人生の選択は基本的に親の意見に沿って決めてきた。自分発信で何かをやった経験はほとんどない
- 現在の職場（パート）も時間や休みなど条件で選んだだけ
- すりんく入会は「初めて自分の意思で決めたこと」と自覚。占い（獅子座の下半期運勢＝「この夏、失敗したことに再チャレンジすると良い」）と過去の在宅ワーク挫折、コーチのインスタグラムがきっかけで再挑戦を決意
- コーチのフィードバック：占いがきっかけでも、実際に行動を選んだのは本人の意思であり、大きな一歩

## 8. 性格：めんどくさがり・楽観的（長所として言語化）
- 家事は手を抜くタイプ。掃除は「見えるところが綺麗ならOK」で後回しにすることもある
- 子育てでも、ダメなことは線引きしつつ、多少のことは「まあいいか」と力を抜いて対応
- コーチのフィードバック：完璧主義にならず楽観的に構えられるのは長所。コントロールできないことにイライラしすぎず、ストレスを溜めにくい性質

## 9. 価値観
- 働く上で大事にしたいこと：人との関わり方・チームワーク（一人で働いた経験がないため）
- 人生で大事にしたいキーワード：自分の意思で選択すること、自分の気持ち・やりたいことを尊重すること
- 「自分で選べる自分」に対する自信を持ちたいという願望

## 10. 緊張・不安について
- セッション中もキックオフ時も一貫して緊張していると発言。理由は「未知の世界で何が起こるか分からないから」
- コーチの助言：コンテンツを決めて学びを進める中で少しずつ理解が深まっていくので心配しなくて大丈夫

## 11. 1回目の宿題・次回セッションの予定
- 成功体験を見つけるワークに再チャレンジ：大きな成果でなくてよく、「うまくいったな」と思える小さなことをハードルを下げて書き出す
- 過去の出来事を深掘りし、得意なことにつながる成功体験を何個か書き出せたら本人からLINEで連絡
- 連絡が来たら次回セッション（2回目）を設定し、成功体験の深掘りとコンテンツ決定に向けて進める予定

## 12. 【2回目】自己理解ワークの再挑戦と感想
- 前回より時間はかからなかった感覚はあるが、依然としてスラスラとは書けず難しさが残る
- 日常の中で「今イライラしているのは何が原因か」「本当はどうしてほしかったのか」を意識するようにしていたが、いざワークに書き起こすと言語化が難しい
- コーチの提案：ノートに書くのが大変であれば、スマホの録音機能や無料の音声配信アプリ（stand.fm等）を使い、限定公開設定で「自分に向けて」1日5分程度、感情を声に出して話す練習を勧められる（コーチ自身がVoicyで実践している方法）
- 本人は「話すこと・おしゃべりは好きだが語彙力や中身が足りない」と自覚しており、寝る前に1日の振り返りを声に出す練習に取り組むことを約束

## 13. 【2回目】成功体験①：お弁当作り
- 娘の夏休み中の預かり保育で、生まれて初めてお弁当作りに挑戦し成功
- 事前によく食べる/食べないものを調べ、時短できる作り置きや冷凍食品の活用も検討。朝の動線をシミュレーションしてから本番に臨んだ
- 結果的にお弁当作りが継続でき、日々の実践を通じて徐々に時短・改善もできるようになった
- コーチの分析：「事前にしっかり調べ、シミュレーションしてから取り組む」という行動特性が成功の背景にあると言語化

## 14. 【2回目】強み：事前準備・先読み志向
- 出かける支度なども前日までに済ませておきたいタイプ。「行き当たりばったり・突発的な対応」が苦手という自己認識
- 仕事（飲食）でも、天候や曜日から来客数を予測して仕込み量を事前に調整するなど、先を読んで動く場面が多い
- コーチのフィードバック：この「事前準備・先読み志向」は本人特有の強みであり、失敗を防ぐ・信頼を得ることにつながる特徴として言語化された

## 15. 【2回目】成功体験②：医療事務での業務効率化
- 前職の医療事務で、紹介状作成が手書きで非効率だった業務にワード（Word）の差し込み機能を発見し活用
- 上司に確認の上、定型文＋個別調整ができるテンプレートを複数パターン作成し、印刷まで仕組み化
- 「言われたことをただこなすのではなく、自分なりに工夫して改善した」経験として、コーチから高く評価される
- コーチの補足：AI活用が今後の在宅ワークの時給を左右する時代であり、「効率化できないか」を考える視点は今後の学びにも直結する重要な資質

## 16. 【2回目】コース・コンテンツの方向性
- 特別コースのため選べるコンテンツは1つ（VIPコースは3つ選択可）。まず何を選ぶかが重要という前提を共有
- 半年後の目標：現在のパート収入に加え、在宅ワークで最低月10万円の収益を安定して維持したい
- 使える時間：夜19:30以降（子どもの就寝後）に平日で約4時間、休日はさらに長く確保可能。日中は仕事とお迎えで時間が取れない
- 検討していたコンテンツ：オンライン秘書とLINE構築の2つ。理由は「自分でもできそう」「時間に正確・几帥（きちんと逆算して準備するタイプ）」という自己分析から

## 17. 【2回目】オンライン秘書とLINE構築の比較検討
- オンライン秘書：クライアントごとに依頼内容が異なり、業務範囲が幅広い（スケジュール管理に限らずクライアントの困りごと全般を代行）。個々の業務難度は高くないが、都度異なる内容に対応する柔軟さが求められる
- LINE構築：操作の型がある程度決まっており、クライアントごとにアレンジはあるが基礎は一貫している。研修・実務を通じて習得していくスタイル
- コーチのフィードバック：これまでのエピソード（先読み・事前準備・型に沿った工夫）から、LINE構築の方が夏さんの特性に合っているとの見立て
- 本人も「決まった型がある方が動きやすい」と共感し、最終的にLINE構築を選択

## 18. 【2回目】コンテンツ決定：LINE構築
- 1つ目のコンテンツとしてLINE構築を正式に選択。今後まるさんと伴走しながら研修・勉強会に参加して学んでいく
- 作業にはパソコン（カメラ付き推奨）が必要。数年前のノートパソコンを保有しており、カメラは要確認
- 案件を掛け合わせて実績を積み、将来的にはLINE構築とオンライン秘書など2コンテンツ目の追加も選択肢として提示された

## 19. 【2回目】コミュニティ・今後のサポート体制
- 自己理解セッションは今回で一区切りだが、今後もコンテンツの悩みや心の面での相談があればいつでもZoom可能（追加費用なし）
- 全体勉強会（8/27予定）と受講生同士の交流会（8/31・大阪）への参加を案内。どちらもすりんく生なら誰でも参加可能
- 一人で抱え込まず、横のつながりを作ることの重要性をコーチから伝えられる
