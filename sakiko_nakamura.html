# さきこさん（中村咲子）自己理解マインドマップ

## 1. セッション概要
- 自己理解セッションは最初の1〜2回（人によっては3回）で実施し、主にどのコンテンツを選ぶかを一緒に考える位置づけ
- コンテンツ決定後も、迷い・立ち止まりがあればいつでもZoomで相談可能（回数制限なし）
- ライトコースのため、選べるコンテンツは2つ

## 2. 自己理解ワークとの向き合い方
- 動画視聴・価値観ワークの前半までは完了。後半は途中
- 「こんなに深く自分について考えたことがなかった」という感想
- 特に難しかったのは「なりたい姿の具体化」のうち見た目・健康の項目。暮らしや働き方は考えられたが、自分の容姿・美容への投資は考えたことがなかった
- 理由を深掘りすると、「自分に使うお金がもったいない」という価値観があり、余裕がないというより「子どものためにお金を使いたい」という優先順位の表れだと自己分析

## 3. 理想の暮らし・働き方
- 週2〜3回は外でパート等で働き、それ以外は在宅ワーク。子どもの体調不良や長期休みにも対応できる働き方を希望
- 収入目標：パート収入（月6〜7万円）＋在宅ワークで月30万円程度、合計37〜40万円弱を目指す
- 理想の暮らし：家族で我慢せず、子どものやりたいことを応援し、年2回程度旅行（沖縄など）に行けるゆとりのある暮らし

## 4. 現状・理想までのギャップ
- 現状の満足度は自己評価60点程度。在宅でしっかり働けるようになれば大きく変わるという認識
- コーチより：学びの過程で「何のために頑張っているのか」を見失いそうになる時こそ、この理想の状態を思い出してほしいとの助言

## 5. 強み：段取り力・仕組み化
- 友人から「整えることが上手」と言われる。家事や生活の仕組み化が得意（例：土日にまとめて1週間分の作り置きをして平日の負担を減らす）
- 朝4時〜4時半に起床し、自分の時間を確保する習慣を最近開始
- 物の定位置を決めて子どもが自分で管理できるようにするなど、家庭内の仕組み化も得意
- ワンオペで頼れる人が少ない環境の中、「どう回すか」を常に考えて行動してきた結果として身についた力と自己分析

## 6. 性格：段取り重視・せっかち
- 何をするにも事前に計画を立てるタイプ。計画があることで気持ちが安定する
- 時間にルーズな人や、決めた段取りを途中で変更されることに強いストレスを感じる
- 物事を決める際はじっくり考えるタイプで、即決することはあまりない

## 7. 個性心理学（動物占い）
- 本質：コアラ／意思決定：トラ／表面：サル
- コーチ（本質・意思決定ともにコアラ・トラが強い）と共通点が多く、「段取りを乱されると不機嫌になる」特性が一致
- 誕生日1989年9月16日をもとにコーチが診断

## 8. 過去の成功体験：調理師時代の段取り力
- 過去、給食調理員として勤務。限られた時間内に効率よく調理を終わらせるため、洗い物を減らす順序など自分なりの段取りを工夫し、時間内にしっかり仕事を終わらせていた

## 9. 得意なこと：仕組み化・片付けへの関心
- 「仕組み化するのが上手い」と自認。一度整えた仕組みは継続して回せる
- 片付けが元々苦手で、片付け講座を受講した経験あり。将来的に自社商品化も検討していた時期がある（現在は進んでいない）

## 10. 現状使える時間
- 朝4〜7時ごろの2〜3時間を学習・作業時間として確保できる（子どもが起きる前の一人の時間を大切にしたい）
- コワーキングスペースの無料開放・税務相談等のサービスにも高い関心を示す（パソコンさえあればどこでも働ける状態への強い憧れ）

## 11. コンテンツ検討：インスタの方向性
- 現在レシピ系インスタアカウントを運用中だが、属人性（顔・考え方の発信）がなく、保存されるだけでファン化・マネタイズにつながっていない課題を指摘される
- タイアップ（アフィリエイト・固定案件）はいずれも「誰が発信しているか」が重要であり、属人性のない手元だけの発信では案件獲得が難しいと説明を受ける
- 運用代行も選択肢の一つ。動画編集は既にある程度のレベルに達していると評価される

## 12. 収入目標・コンテンツの絞り込み
- 半年後：月10万円、1年後：月20万円を目指す
- インスタで属人性を出す方向にコンセプトを転換しつつ、無収入期間を避けるため「稼ぎながら学ぶ」スタイルを希望（月3〜5万円を稼ぎながら進めたい）
- 選択肢：①インスタの自分アカウントに集中する、②他コンテンツを学びながらインスタを育てる、③インスタの運用代行をしながら自分のアカウントも育てる、のいずれかを次回までに検討

## 13. 次回セッションへの持ち越し
- スリンクの各コンテンツ詳細スライドをLINEで送付、次回セッションまでに目を通してもらう
- 次回（夏休み明け以降を予定）、インスタ以外のコンテンツを学ぶか、インスタの運用代行を目指すかを本人の意向を踏まえて決定する
